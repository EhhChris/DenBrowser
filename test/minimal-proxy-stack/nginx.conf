# Test upstream for the DenBrowser attestation proxy.
#
# The proxy always dials its upstream over TLS (see proxy/src/main.rs
# `upstream_peer`, which builds the HttpPeer with tls=true), so this server
# must terminate TLS or the handshake fails with an SSL "wrong version number"
# error (TLS ClientHello hitting a cleartext port).
#
# It reuses the dev TLS material in build/ (proxy-tls.crt / proxy-tls.key,
# produced by scripts/gen-proxy-tls.sh) mounted as Compose secrets. The cert is
# self-signed and does not contain the Compose service name, so the test proxy
# starts with --insecure-upstream. Production must use a separately issued
# upstream identity and verify it.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /run/secrets/proxy_tls_cert;
    ssl_certificate_key /run/secrets/proxy_tls_key;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The roundtrip test binds a POST body into its attestation token and uses
    # this endpoint to confirm the verified request reaches the upstream. The
    # mirror phase consumes the entire body before the response is returned,
    # including the test's large unbound upload.
    location = /echo {
        mirror /discard-body;
        mirror_request_body on;
        proxy_pass https://127.0.0.1:443/echo-response;
        proxy_ssl_verify off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /discard-body {
        internal;
        return 204;
    }

    location = /echo-response {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Returns a simple page showing key forwarded headers
    location /headers {
        default_type text/plain;
        return 200 "X-Forwarded-For: $http_x_forwarded_for\nX-Real-IP: $http_x_real_ip\nVia: $http_via\nHost: $host\nUser-Agent: $http_user_agent\n";
    }
}
