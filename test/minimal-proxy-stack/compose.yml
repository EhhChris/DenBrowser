name: denbrowser-minimal-proxy-stack

services:
  proxy:
    image: denbrowser/proxy:dev
    build:
      context: ../../proxy
    command:
      - --config
      - /etc/denbrowser/config.toml
      # The test upstream uses the proxy's self-signed development certificate.
      - --insecure-upstream
    configs:
      - source: proxy_config
        target: /etc/denbrowser/config.toml
    secrets:
      - proxy_tls_cert
      - proxy_tls_key
      - proxy_attestation_key
      - user_ca
      - machine_ca
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - ingress
      - upstream
    depends_on:
      upstream:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  upstream:
    image: nginx:alpine
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
      - source: site_index
        target: /usr/share/nginx/html/index.html
    secrets:
      # This remains a self-contained development stack by reusing the local
      # development certificate for upstream TLS. The proxy deliberately skips
      # upstream verification above; production must use a separately issued
      # upstream identity and enable verification.
      - proxy_tls_cert
      - proxy_tls_key
    expose:
      - "443"
    networks:
      - upstream
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --no-check-certificate https://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # One-shot integration client. It joins the proxy's ingress bridge directly,
  # so the proxy sees this container's address rather than a published-port NAT
  # gateway. Docker DNS resolves the service name "machine-client" to the same
  # address when `docker compose run --use-aliases` is used, satisfying the
  # positive machine-identity check without static IPs.
  machine-client:
    profiles: ["test"]
    image: denbrowser/roundtrip-client:dev
    build:
      context: ..
      dockerfile: minimal-proxy-stack/Dockerfile.client
    environment:
      DENBROWSER_WAIT_HOST: proxy
      DENBROWSER_WAIT_PORT: "8081"
      DENBROWSER_PROXY_URL: https://proxy:8081
      PUBLIC_KEY_PATH: /run/secrets/proxy_attestation_public_key
      DENBROWSER_TLS_CERT: /run/secrets/proxy_tls_cert
      DENBROWSER_CLIENT_CERT: /run/secrets/user_cert
      DENBROWSER_CLIENT_KEY: /run/secrets/user_key
      DENBROWSER_MACHINE_IDENTITY_ENABLED: "1"
      DENBROWSER_MACHINE_CERT: /run/secrets/machine_cert
      DENBROWSER_MACHINE_CA: /run/secrets/machine_ca
      DENBROWSER_MACHINE_CA_KEY: /run/secrets/machine_ca_key
      # The proxy resolves this name on its separate upstream network. A cert
      # naming it is validly issued but cannot match this client's source IP.
      DENBROWSER_MACHINE_MISMATCH_CN: upstream
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - proxy_tls_cert
      - proxy_attestation_public_key
      - user_cert
      - user_key
      - machine_cert
      - machine_ca
      - machine_ca_key
    networks:
      - ingress
    depends_on:
      proxy:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

configs:
  proxy_config:
    file: ./config.toml
  nginx_config:
    file: ./nginx.conf
  site_index:
    file: ./index.html

secrets:
  proxy_tls_cert:
    file: ../../build/compose-proxy-tls.crt
  proxy_tls_key:
    file: ../../build/compose-proxy-tls.key
  proxy_attestation_key:
    file: ../../build/proxy-private.pem
  proxy_attestation_public_key:
    file: ../../build/proxy-public.pem
  user_ca:
    file: ../../build/user-ca.crt
  user_cert:
    file: ../../build/user-cert.crt
  user_key:
    file: ../../build/user-cert.key
  machine_ca:
    file: ../../build/machine-ca.crt
  machine_ca_key:
    file: ../../build/machine-ca.key
  machine_cert:
    file: ../../build/machine-cert.crt

networks:
  ingress:
  upstream:
    internal: true
