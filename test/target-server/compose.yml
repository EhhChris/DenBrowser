services:
  target:
    image: nginx:alpine
    ports:
      - "8080:80"     # plaintext, for direct debugging only
      - "8443:443"    # TLS — point the proxy's DENBROWSER_UPSTREAM here
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Reuse the proxy's dev TLS cert (scripts/gen-proxy-tls.sh) as the
      # upstream's server cert. CN/SAN=localhost matches the SNI the proxy
      # sends; it's self-signed, so run the proxy with --insecure-upstream.
      - ../../build/proxy-tls.crt:/etc/nginx/certs/proxy-tls.crt:ro
      - ../../build/proxy-tls.key:/etc/nginx/certs/proxy-tls.key:ro
    restart: unless-stopped
