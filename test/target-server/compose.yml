# Note on mTLS: the proxy's [mtls] layer authenticates the *browser* to the
# *proxy* (client -> proxy). This nginx is the upstream *behind* the proxy, so it
# needs no changes for mTLS — the proxy still dials it with its own TLS client and
# --insecure-upstream. To exercise mTLS end-to-end, run gen-user-cert.sh and have
# the test client present build/user-cert.* to the proxy (see the roundtrip test
# and proxy/stress/README.md); nothing below changes.
services:
  target:
    image: nginx:alpine
    ports:
      - "8080:80"     # plaintext, for direct debugging only
      - "8443:443"    # TLS — point [proxy].upstream at this port
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Reuse the proxy's dev TLS cert (scripts/gen-proxy-tls.sh) as the
      # upstream's server cert. CN/SAN=localhost matches the SNI the proxy
      # sends; it's self-signed, so run the proxy with --insecure-upstream.
      - ../../build/proxy-tls.crt:/etc/nginx/certs/proxy-tls.crt:ro
      - ../../build/proxy-tls.key:/etc/nginx/certs/proxy-tls.key:ro
    restart: unless-stopped
