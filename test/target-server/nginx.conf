server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Returns a simple page showing key forwarded headers
    location /headers {
        default_type text/plain;
        return 200 "X-Forwarded-For: $http_x_forwarded_for\nX-Real-IP: $http_x_real_ip\nVia: $http_via\nHost: $host\nUser-Agent: $http_user_agent\n";
    }
}
