# Test upstream for the DenBrowser attestation proxy.
#
# The proxy always dials its upstream over TLS (see proxy/src/main.rs
# `upstream_peer`, which builds the HttpPeer with tls=true), so this server
# must terminate TLS or the handshake fails with an SSL "wrong version number"
# error (TLS ClientHello hitting a cleartext port).
#
# It reuses the dev TLS material in build/ (proxy-tls.crt / proxy-tls.key,
# produced by scripts/gen-proxy-tls.sh) mounted at /etc/nginx/certs by
# compose.yml. That cert is self-signed with CN/SAN=localhost, which matches
# the SNI the proxy sends, but its CA is untrusted — so run the proxy with
# --insecure-upstream in dev to skip verification.
#
# Port 80 stays plaintext for direct debugging (e.g. curl
# http://localhost:8080/health); the proxy itself must target the TLS port
# (8443 -> 443).
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/proxy-tls.crt;
    ssl_certificate_key /etc/nginx/certs/proxy-tls.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Returns a simple page showing key forwarded headers
    location /headers {
        default_type text/plain;
        return 200 "X-Forwarded-For: $http_x_forwarded_for\nX-Real-IP: $http_x_real_ip\nVia: $http_via\nHost: $host\nUser-Agent: $http_user_agent\n";
    }
}
