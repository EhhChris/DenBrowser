[package]
name = "denbrowser-proxy"
version = "0.7.0"
edition = "2024"

[[bin]]
name = "denbrowser-proxy"
path = "src/main.rs"

[dependencies]
# `openssl` feature enables TLS termination at the listen socket.
pingora-core   = { version = "0.8", features = ["openssl"] }
pingora-proxy  = { version = "0.8", features = ["openssl"] }
pingora-http   = "0.8"
pingora-limits = "0.8"

async-trait = "0.1"

# Operational config file (listener, routing, TLS, and access controls).
serde   = { version = "1", features = ["derive"] }
toml    = "0.8"
globset = "0.4"
ipnet   = "2"

p256    = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
sha2    = "0.10"

# Machine-identity certificate verification.  `openssl` is a *direct* dependency
# rather than only pingora's re-export because `pingora-openssl` re-exports
# `dh, error, hash, nid, pkey, ssl, x509` and not `stack`, which
# `X509StoreContextRef::init` needs for its `cert_chain` argument.  Cargo unifies
# this with the version pingora already pins, so `openssl::x509::X509` and
# `pingora_core::tls::x509::X509` are the same type.  Deliberately WITHOUT the
# `vendored` feature: that would build a second libssl and break the ABI shared
# with the `openssl-sys` pingora links against.
openssl = "0.10"

# `tokio::net::lookup_host` for the machine-identity forward-DNS check.  Already
# present transitively (pingora's runtime); named here only to reach `net`.
tokio   = { version = "1", features = ["net"] }

base64     = "0.22"
bytes      = "1"
http       = "1"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"

# Logging.  `tracing` is the facade the proxy's own call sites use; pingora
# emits through the older `log` facade, which `tracing-subscriber`'s default
# `tracing-log` feature bridges into the same subscriber.  `log` stays a direct
# dependency so `logging.rs` can clamp that bridge's level (see its module docs).
# `env-filter` is NOT a default feature of tracing-subscriber and must be asked
# for; it is what gives `[logging].level` and `RUST_LOG` their filter syntax.
log                = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile  = "3"
# `#[tokio::test]` for the machine-identity DNS cache tests.  Named explicitly
# rather than relying on pingora's tokio features unifying in, so the tests keep
# building if that ever changes.
tokio     = { version = "1", features = ["macros", "rt"] }
