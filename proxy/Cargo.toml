[package]
name = "denbrowser-proxy"
version = "0.5.1"
edition = "2024"

[[bin]]
name = "denbrowser-proxy"
path = "src/main.rs"

[dependencies]
# `openssl` feature enables TLS termination at the listen socket.
pingora-core   = { version = "0.8", features = ["openssl"] }
pingora-proxy  = { version = "0.8", features = ["openssl"] }
pingora-http   = "0.8"
pingora-limits = "0.8"

async-trait = "0.1"

# Operational config file (listener, routing, TLS, and access controls).
serde   = { version = "1", features = ["derive"] }
toml    = "0.8"
globset = "0.4"
ipnet   = "2"

p256    = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
sha2    = "0.10"

base64     = "0.22"
bytes      = "1"
http       = "1"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"

# Logging.  `tracing` is the facade the proxy's own call sites use; pingora
# emits through the older `log` facade, which `tracing-subscriber`'s default
# `tracing-log` feature bridges into the same subscriber.  `log` stays a direct
# dependency so `logging.rs` can clamp that bridge's level (see its module docs).
# `env-filter` is NOT a default feature of tracing-subscriber and must be asked
# for; it is what gives `[logging].level` and `RUST_LOG` their filter syntax.
log                = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile  = "3"
