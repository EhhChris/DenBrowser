# DenBrowser proxy — operational configuration (example).
#
# Pass this file to the proxy with `--config proxy.toml` (or the
# DENBROWSER_CONFIG env var).  It is optional: with no config file, every
# feature below stays OFF and the proxy behaves as it did before configs
# existed.  This is the file to grow as more runtime options are added.

[rate_limiting]
# Master on/off switch.  When false, nothing below takes effect — keep a tuned
# ruleset in the file and flip it off with this one line.
enabled = true

# Universal cap, applied per client IP across *every* request:
#   at most `max_requests` per `window_secs` seconds from any single origin IP.
# Set either to 0 to disable the universal cap (the per-pattern `rules` below can
# still apply on their own).
window_secs  = 1
max_requests = 100

# Per-URL-pattern rules.  Each rule keeps its OWN counter keyed by origin IP, so
# a burst against one pattern is throttled independently of the others and of the
# universal cap above.  `pattern` is a glob matched against "{host}{path}"; `*`
# matches any run of characters (including `/`), so `.../secrets/*` covers
# everything nested under that prefix.  Rules are evaluated top-to-bottom and the
# first match wins.

# Tight limit on a sensitive area: 5 requests / minute / IP.
[[rate_limiting.rules]]
pattern      = "example.com/secrets/*"
window_secs  = 60
max_requests = 5

# Looser limit on a high-traffic area: 50 requests / second / IP.
[[rate_limiting.rules]]
pattern      = "example.com/news/*"
window_secs  = 1
max_requests = 50

# ---------------------------------------------------------------------------

[proxy_bypass]
# Attestation bypass: let specific, strongly authenticated callers skip
# attestation and be forwarded straight upstream.  Intended for trusted
# infrastructure (health checks, internal automation) that can't run the
# DenBrowser attestation client.
#
# DEFAULT-DENY: with enabled = false, no request is ever bypassed and the TLS
# listener does not even request a client certificate.  When enabled, a request
# is bypassed ONLY if it satisfies ALL of the conditions below; any miss (wrong
# IP, no cert, untrusted cert, or unlisted subject) falls through to normal
# attestation, so a misconfiguration here can never block a legitimate client.
enabled = false

# Source IP ranges (CIDR) permitted to bypass. A request from any other address
# is attested normally. Required (non-empty) when enabled.
allowed_ip_ranges = ["10.0.0.0/8", "192.168.1.0/24"]

# PEM bundle of CA certificate(s). A bypass candidate must present a client
# certificate (mTLS) that chains to one of these. The listener requests a client
# cert with a *soft* verify — clients that present none, or an untrusted one, are
# never disconnected, they just don't qualify for bypass. Required when enabled.
client_ca = "/etc/denbrowser/bypass-ca.pem"

# Subject allowlist. After a client cert validates against client_ca, its Common
# Name or one of its SubjectAltName DNS entries must exactly match an entry here.
# Lets one CA issue many certs while only these identities may bypass. Required
# (non-empty) when enabled.
allowed_subjects = ["health-checker", "ops.internal"]
