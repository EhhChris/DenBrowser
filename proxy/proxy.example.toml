# DenBrowser proxy — operational configuration (example).
#
# Copy this file to `proxy.toml` and edit it.  The proxy loads `proxy.toml` from
# its working directory by default (override with `--config <path>` or the
# DENBROWSER_CONFIG env var) and is REQUIRED: the proxy exits on startup if the
# config file is missing or unparseable. Core listener, upstream, TLS, and
# attestation values are required; optional features are off by default.
#
# Windows note: TOML basic (double-quoted) strings treat backslash as an escape,
# so a path like "C:\Users\..." breaks (\U starts a unicode escape).  Use a
# single-quoted literal ('C:\Users\...') or forward slashes ("C:/Users/...").

[proxy]
# REQUIRED. Address and port on which the proxy accepts browser TLS connections.
listen = "0.0.0.0:8081"

# REQUIRED. TLS upstream endpoint to receive verified requests (host:port).
upstream = "localhost:8443"

# REQUIRED. TLS identity presented to the browser. The browser pins the
# certificate's SPKI, so rotating it requires rebuilding DenBrowser with the
# new certificate or pin in config/site-config.json.
tls_cert = "../build/proxy-tls.crt"
tls_key = "../build/proxy-tls.key"

# ---------------------------------------------------------------------------

[attestation]
# REQUIRED.  Path to this proxy's EC P-256 attestation private key (SEC1 PEM) —
# the private half of the public key baked into the browser build for this
# proxy.  It is what decrypts per-request ECIES tokens, so the proxy exits at
# startup if this is unset, unreadable, or not a parseable EC key, rather than
# coming up and rejecting every attested request.
#
# Generate with:  scripts/gen-attest-key.sh --name <proxy>
# and reference the matching <proxy>-public.der from the browser build's
# config/site-config.json "proxies" entry.
#
# Relative paths resolve against the proxy's working directory (the default
# below assumes running from proxy/ against a dev key in build/).  A deployment
# fronting several partner applications runs one proxy process per partner,
# each with its OWN config file naming its OWN key — one partner must never be
# able to decrypt another's tokens.
private_key = "../build/proxy-private.pem"

# ---------------------------------------------------------------------------

[rate_limiting]
# Master on/off switch.  When false, nothing below takes effect — keep a tuned
# ruleset in the file and flip it off with this one line.
enabled = true

# Universal cap, applied per client IP across *every* request:
#   at most `max_requests` per `window_secs` seconds from any single origin IP.
# Set either to 0 to disable the universal cap (the per-pattern `rules` below can
# still apply on their own).
window_secs  = 1
max_requests = 100

# Per-URL-pattern rules.  Each rule keeps its OWN counter keyed by origin IP, so
# a burst against one pattern is throttled independently of the others and of the
# universal cap above.  `pattern` is a glob matched against "{host}{path}"; `*`
# matches any run of characters (including `/`), so `.../secrets/*` covers
# everything nested under that prefix.  Rules are evaluated top-to-bottom and the
# first match wins.

# Tight limit on a sensitive area: 5 requests / minute / IP.
[[rate_limiting.rules]]
pattern      = "example.com/secrets/*"
window_secs  = 60
max_requests = 5

# Looser limit on a high-traffic area: 50 requests / second / IP.
[[rate_limiting.rules]]
pattern      = "example.com/news/*"
window_secs  = 1
max_requests = 50

# ---------------------------------------------------------------------------

[mtls]
# Baseline mutual-TLS client authentication. When enabled, EVERY connection
# (attestation clients and bypass clients alike) must present a client
# certificate that chains to client_ca — verified at the TLS handshake, so a
# client with no certificate or an untrusted one is rejected before it reaches
# the request path.
#
# This is one of four orthogonal layers and replaces none of them: mTLS
# authenticates the user (client -> proxy), TLS SPKI pinning authenticates
# the proxy to the browser (proxy -> client), attestation proves the request
# came from a genuine DenBrowser build and binds it against replay/tampering,
# and machine identity ([machine_identity] below) names the workstation.
#
# Disabled by default: with enabled = false, no client certificate is requested
# and the listener behaves exactly as before.
enabled = false

# PEM bundle of CA certificate(s) that presented client certs must chain to.
# Required when enabled.
client_ca = "/etc/denbrowser/user-ca.pem"

# ---------------------------------------------------------------------------

[machine_identity]
# Identifies the *workstation* a request came from — the fourth orthogonal
# layer, alongside mTLS (the user), TLS pinning (the proxy), and attestation
# (the software).
#
# The browser sends its machine certificate as base64 DER in
# X-DenBrowser-Machine-Cert on every request. It travels in a header rather than
# the TLS handshake because a handshake carries exactly one client certificate
# chain and the user certificate already occupies it. The proxy verifies the
# certificate chains to machine_ca, that its Common Name is on
# allowed_hostnames, and that the name forward-resolves to the connecting
# address — then records that hostname in the audit trail. It grants nothing.
#
# WHAT THIS PROVES: that the name was issued by your CA and is being presented
# from an address that name points at. NOT that the sender holds the private
# key — a certificate is a public document and this layer performs no proof of
# possession. It is therefore weaker than attestation against a compromised
# endpoint, and complements rather than replaces it.
#
# DEPLOYMENT PREREQUISITE: because the forward-DNS check is unconditional,
# clients must reach the proxy on their own addresses. Behind NAT, a VPN
# concentrator, or any shared egress the proxy sees the gateway address, which
# is in no workstation's A record, and every request is rejected.
#
# Disabled by default: with enabled = false the header is ignored entirely.
enabled = false

# PEM bundle of CA certificate(s) that presented machine certs must chain to.
# Required when enabled. MUST be a different CA from [mtls].client_ca — the two
# identities are told apart by their issuer, and startup rejects an overlap.
machine_ca = "/etc/denbrowser/machine-ca.pem"

# Reject a request whose machine certificate is missing or invalid. On by
# default; set false only while rolling the browser side out, so a fleet
# mid-upgrade is not locked out.
# required = true

# Glob patterns the Common Name must match. Empty (the default) accepts any name
# the CA signed; the forward-DNS check still applies either way. As in
# [[rate_limiting.rules]], "*" matches any run of characters INCLUDING dots, so
# "*.corp.example.com" also matches "a.b.corp.example.com". Patterns must be
# lowercase — the CN is lowercased before matching, since DNS is
# case-insensitive — and an uppercase pattern aborts startup rather than
# silently matching nothing.
# allowed_hostnames = ["ws-*.corp.example.com"]

# Forward-DNS cache. Workstation A records are stable for hours, so this is what
# keeps the check off the resolver: one query per workstation per window rather
# than one per request. A 1,000-machine fleet at the default costs ~3 queries/s.
# dns_ttl_secs = 300
#
# Failed lookups are cached too, on a shorter TTL, so one unprovisioned machine
# cannot query on every request — short enough that a freshly registered machine
# is not locked out for the full positive window.
# dns_negative_ttl_secs = 30
#
# How far past its TTL an entry may still be used while the resolver itself is
# failing, so a DNS outage does not become a proxy outage. This opens no hole: a
# cold cache with a failing resolver still rejects. 0 disables serving stale.
# dns_stale_grace_secs = 3600

# Treat any certificate in machine_ca as a trust anchor rather than requiring
# the chain to reach a self-signed root. Enterprises routinely distribute an
# issuing CA rather than the root; without this, such a bundle fails to verify.
# partial_chain = false

# ---------------------------------------------------------------------------

[proxy_bypass]
# Attestation bypass: let specific, strongly authenticated callers skip
# attestation and be forwarded straight upstream.  Intended for trusted
# infrastructure (health checks, internal automation) that can't run the
# DenBrowser attestation client.
#
# Builds on baseline mTLS and REQUIRES [mtls] to be enabled — the client cert is
# already verified against the mTLS CA at the handshake, so bypass adds only the
# two conditions below. DEFAULT-DENY: with enabled = false, every request is
# attested. When enabled, a request is bypassed ONLY if BOTH conditions hold; any
# miss falls through to normal attestation, so this can never block a legitimate
# client.
enabled = false

# Source IP ranges (CIDR) permitted to bypass. A request from any other address
# is attested normally. Required (non-empty) when enabled.
allowed_ip_ranges = ["10.0.0.0/8", "192.168.1.0/24"]

# Subject allowlist matched against the mTLS-verified client certificate's Common
# Name or one of its SubjectAltName DNS entries. Lets one CA issue many user
# certs while only these identities may bypass. Required (non-empty) when enabled.
allowed_subjects = ["health-checker", "ops.internal"]

# ---------------------------------------------------------------------------

[logging]
# Where and how this proxy records what it did.  DenBrowser's browser build has
# telemetry and diagnostics patched out, so the proxy is the only component that
# records anything — this output IS the audit trail.
#
# Every setting below is optional and the defaults shown are what applies when
# the whole section is omitted.

# Directory for rotating log files.  EMPTY (the default) means stderr only.
# Created at startup if it does not exist; the proxy EXITS if it is set but
# cannot be created or written, rather than starting with no audit trail.
# Relative paths resolve against the proxy's working directory, as tls_cert and
# client_ca do.  The Windows backslash note at the top of this file applies here.
dir = "../build/logs"

# Base filename inside `dir`.  The rotation stamp is appended, giving files like
# denbrowser-proxy.log.2026-08-01.
file_prefix = "denbrowser-proxy.log"

# Verbosity, in RUST_LOG syntax: a bare level (trace, debug, info, warn, error,
# off) or per-module directives such as "info,denbrowser_proxy=debug".  Setting
# RUST_LOG in the environment overrides this value entirely, which is the
# convenient way to turn up detail for one run without editing this file.
#
# `info` records both accepted and rejected requests.  Drop to `warn` to log
# only rejections and rate limiting.
level = "info"

# How often to start a new file: "minutely", "hourly", "daily", or "never".
rotation = "daily"

# How many rotated files to keep, oldest deleted first.  0 keeps every file —
# disk growth is then unbounded, so pair it with external retention.
max_files = 14

# Also mirror everything to stderr.  Keep this on for systemd/journald capture
# and for local development; the file stays free of terminal colour codes either
# way.
stderr = true
