// mozilla.cfg — DenBrowser enforced lockdown configuration
// Loaded at startup by autoconfig.js. lockPref() values are enforced for all
// profiles and cannot be overridden by prefs.js, about:config, or any user action.
// The autoconfig parser skips the first line of this file — real content starts here.

// ── Disk cache: all off, memory cache only ────────────────────────────────────
lockPref("browser.cache.disk.enable", false);
lockPref("browser.cache.disk.smart_size.enabled", false);
lockPref("browser.cache.disk.capacity", 0);
lockPref("browser.cache.disk.max_entry_size", 0);
lockPref("browser.cache.offline.enable", false);
lockPref("browser.cache.offline.capacity", 0);
// Memory cache: keep enabled, let Firefox auto-size based on available RAM.
// -1 = auto (~256 MB on 16 GB RAM). Affects HTTP resource cache only, not per-tab RAM.
lockPref("browser.cache.memory.enable", true);
lockPref("browser.cache.memory.capacity", -1);

// ── Media cache: memory only ──────────────────────────────────────────────────
// Belt-and-suspenders alongside private browsing (which already routes MediaCache
// to the memory backend). cache_size=0 hard-disables the disk-backed media cache
// used for HTMLMediaElement buffering/seeking; memory_cache_max_size lifts the
// in-memory cap from the 8 MB default so video playback isn't starved.
lockPref("media.cache_size", 0);
lockPref("media.memory_cache_max_size", 65536);

// ── Private browsing: always on ───────────────────────────────────────────────
// Keeps history, form data, cookies in memory only. Belt-and-suspenders for ramdisk profile.
lockPref("browser.privatebrowsing.autostart", true);

// ── Session restore: disabled ─────────────────────────────────────────────────
lockPref("browser.sessionstore.resume_from_crash", false);
lockPref("browser.sessionstore.max_tabs_undo", 0);
lockPref("browser.sessionstore.max_windows_undo", 0);
lockPref("browser.sessionstore.interval", 2147483647); // Effectively disable writes

// ── Downloads: block all to disk ─────────────────────────────────────────────
// Policy sets PromptForDownloadLocation false; patch 004 enforces the actual block.
lockPref("browser.download.useDownloadDir", false);
lockPref("browser.download.forbid_open_with", true);
lockPref("browser.download.always_ask_before_handling_new_types", true);
lockPref("browser.download.manager.retention", 0);
lockPref("browser.download.start_downloads_in_tmp_dir", false);
lockPref("browser.helperApps.deleteTempFileOnExit", true);

// ── Extensions: disabled ─────────────────────────────────────────────────────
// Belt-and-suspenders alongside ExtensionSettings policy and patch 011.
lockPref("xpinstall.enabled", false);

// ── Screensharing ─────────────────────────────────────────────────────────────
// Belt-and-suspenders for patch 002.
lockPref("media.getusermedia.screensharing.enabled", false);
lockPref("media.getusermedia.browser.enabled", false);
lockPref("media.getusermedia.window.focus_source.enabled", false);

// ── Developer tools ───────────────────────────────────────────────────────────
// Belt-and-suspenders alongside DisableDeveloperTools policy and patch 008.
// This entire section is stripped from the dev build by build.sh --dev.
lockPref("devtools.policy.disabled", true);
lockPref("devtools.chrome.enabled", false);
lockPref("devtools.debugger.remote-enabled", false);
lockPref("devtools.debugger.prompt-connection", false);
// Marionette is always compiled in on modern Firefox ESR; disable at runtime.
// Stripped here (not mozconfig) so --dev builds can use GeckoDriver for testing.
lockPref("marionette.enabled", false);

// ── Clipboard ─────────────────────────────────────────────────────────────────
// Belt-and-suspenders alongside patch 003.
lockPref("dom.allow_cut_copy", false);
lockPref("dom.event.clipboardevents.enabled", false);

// ── Printing ─────────────────────────────────────────────────────────────────
// Belt-and-suspenders alongside DisablePrinting policy and patch 005.
// print.enabled=false causes PrintOuter to return before reaching C++.
lockPref("print.enabled", false);

// ── Screenshots (built-in) ────────────────────────────────────────────────────
// Belt-and-suspenders alongside DisableScreenshots policy.
lockPref("extensions.screenshots.disabled", true);

// ── Telemetry and diagnostics: all off ───────────────────────────────────────
// Belt-and-suspenders alongside DisableTelemetry policy and patch 010.
// healthreport.uploadEnabled is read by Glean at fog_init() time.
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
lockPref("app.normandy.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);

// ── WebRTC (prevents IP leaks, also needed for screenshare) ───────────────────
lockPref("media.peerconnection.enabled", false);
lockPref("media.navigator.enabled", false);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.proxy_only", true);

// ── Fingerprinting resistance ─────────────────────────────────────────────────
lockPref("privacy.resistFingerprinting", true);
lockPref("privacy.resistFingerprinting.block_mozAddonManager", true);

// ── Tracking protection ───────────────────────────────────────────────────────
lockPref("privacy.trackingprotection.enabled", true);
lockPref("privacy.trackingprotection.socialtracking.enabled", true);
lockPref("privacy.trackingprotection.cryptomining.enabled", true);
lockPref("privacy.trackingprotection.fingerprinting.enabled", true);

// ── Network: reduce prefetch/speculation ─────────────────────────────────────
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.prefetch-next", false);
lockPref("network.predictor.enabled", false);
lockPref("network.http.speculative-parallel-limit", 0);
lockPref("network.proxy.socks_remote_dns", true);
lockPref("browser.region.network.url", "");

// ── Geolocation ───────────────────────────────────────────────────────────────
lockPref("geo.enabled", false);

// ── External protocol handlers ────────────────────────────────────────────────
// mailto/tel/sms links hand off to the system email/phone app, escaping the
// controlled environment and enabling data exfiltration via draft messages.
// external-default=false blocks any scheme not explicitly listed here as a catch-all.
// registerProtocolHandler prevents web pages from self-registering handlers.
lockPref("network.protocol-handler.external-default", false);
lockPref("network.protocol-handler.external.mailto", false);
lockPref("network.protocol-handler.external.tel", false);
lockPref("network.protocol-handler.external.sms", false);
lockPref("dom.registerProtocolHandler.enabled", false);

// ── Misc: no disk-touching features ──────────────────────────────────────────
lockPref("browser.formfill.enable", false);
lockPref("signon.rememberSignons", false);
lockPref("extensions.formautofill.available", "off");
lockPref("browser.urlbar.suggest.history", false);
lockPref("browser.urlbar.suggest.bookmark", false);
lockPref("places.history.enabled", false);
lockPref("browser.pagethumbnails.capturing_disabled", true);
lockPref("browser.shell.shortcutFavicons", false);
// Service workers have a history of cross-context persistence bugs in PBM.
// Disable outright rather than rely on PBM gating.
lockPref("dom.serviceWorkers.enabled", false);

// ── Mozilla service endpoints that bypass the attestation proxy ──────────────
// These code paths phone home to Mozilla / Google / cert authorities on a
// schedule, typically via HTTP that flows through different channel hooks
// than nsHttpChannel and therefore would not carry X-DenBrowser-* attestation
// headers.  Clearing the endpoint strings is belt-and-suspenders alongside
// the *.enabled flags: even if the feature is somehow re-enabled at runtime
// it has no URL to talk to.
lockPref("browser.safebrowsing.malware.enabled", false);
lockPref("browser.safebrowsing.phishing.enabled", false);
lockPref("browser.safebrowsing.downloads.enabled", false);
lockPref("browser.safebrowsing.downloads.remote.enabled", false);
lockPref("browser.safebrowsing.downloads.remote.url", "");
lockPref("browser.safebrowsing.blockedURIs.enabled", false);
lockPref("browser.safebrowsing.provider.google4.gethashURL", "");
lockPref("browser.safebrowsing.provider.google4.updateURL", "");
lockPref("browser.safebrowsing.provider.google.gethashURL", "");
lockPref("browser.safebrowsing.provider.google.updateURL", "");
lockPref("browser.safebrowsing.provider.mozilla.gethashURL", "");
lockPref("browser.safebrowsing.provider.mozilla.updateURL", "");
lockPref("network.captive-portal-service.enabled", false);
lockPref("captivedetect.canonicalURL", "");
lockPref("network.connectivity-service.enabled", false);
lockPref("network.connectivity-service.DNSv4.domain", "");
lockPref("network.connectivity-service.DNSv6.domain", "");
lockPref("network.connectivity-service.IPv4.url", "");
lockPref("network.connectivity-service.IPv6.url", "");
lockPref("browser.discovery.enabled", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("toolkit.coverage.opt-out", true);
lockPref("toolkit.coverage.endpoint.base", "");
// Remote Settings (Kinto): Firefox polls this for tracking-protection lists,
// addon blocklists, certificate revocation (CRLite), and intermediate-CA
// preloads on a schedule.  Empty server = no polls.
lockPref("services.settings.server", "");
lockPref("services.settings.default_bucket", "");
lockPref("security.remote_settings.crlite_filters.enabled", false);
lockPref("security.remote_settings.intermediates.enabled", false);
lockPref("extensions.blocklist.enabled", false);
lockPref("extensions.blocklist.url", "");
lockPref("extensions.systemAddon.update.enabled", false);
lockPref("extensions.systemAddon.update.url", "");
lockPref("extensions.update.enabled", false);
lockPref("extensions.update.url", "");
lockPref("extensions.update.background.url", "");
lockPref("extensions.getAddons.cache.enabled", false);
lockPref("extensions.getAddons.discovery.api_url", "");
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("app.update.background.enabled", false);
lockPref("app.update.url", "");
lockPref("app.update.url.manual", "");
lockPref("app.update.url.details", "");
// OCSP fetches go out to the issuing CA on every TLS handshake and are
// HTTP-only (per RFC).  They carry no user data but they leak (host, time)
// pairs around the proxy.  Disable entirely — the proxy is the only TLS
// endpoint that matters and its cert is pinned by patch 012.
lockPref("security.OCSP.enabled", 0);
lockPref("security.OCSP.require", false);
// TRR confirmation DNS: an out-of-band probe to verify the DoH server.  With
// DoH off this should already be silent, but "skip" guarantees no probe.
lockPref("network.trr.confirmationNS", "skip");
// Push server URL: only used if dom.push.enabled is true, which we also lock
// off below — empty here is defence-in-depth.
lockPref("dom.push.serverURL", "");

// ── Capability APIs that aren't blocked elsewhere ────────────────────────────
// These are web-platform features whose intended use is to ship data out of
// the browser to another app, device, or destination.  Disable at the pref
// layer so feature detection returns "unsupported" rather than relying on
// per-call permission checks.

// navigator.share — pops the OS share sheet (Mail, AirDrop, Messages, …).
lockPref("dom.webshare.enabled", false);
// File System Access API (showSaveFilePicker, showOpenFilePicker,
// showDirectoryPicker) and Origin Private File System.
lockPref("dom.fs.enabled", false);
lockPref("dom.origin-private-file-system.enabled", false);
// Hardware bridges.  Firefox does not implement most of these, but
// pref-gating them preemptively makes future feature additions safe.
lockPref("dom.webusb.enabled", false);
lockPref("dom.webhid.enabled", false);
lockPref("dom.webserial.enabled", false);
lockPref("dom.serial.enabled", false);
lockPref("dom.webmidi.enabled", false);
lockPref("dom.webmidi.gated", true);
lockPref("dom.bluetooth.enabled", false);
// Notifications, push, payment — UI surfaces that show page-supplied text
// outside the browser window or open external prompts.
lockPref("dom.webnotifications.enabled", false);
lockPref("dom.webnotifications.serviceworker.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("dom.push.connection.enabled", false);
lockPref("dom.payments.request.enabled", false);
// SpeechSynthesis can read page text aloud through the OS speaker (audible
// channel, recordable by a nearby device).  SpeechRecognition uses the mic,
// which is already blocked by the Microphone policy.
lockPref("media.webspeech.synth.enabled", false);
lockPref("media.webspeech.recognition.enable", false);
// Low-bandwidth side channels (idle/battery state) — disable both for
// fingerprinting and covert-signaling hygiene.
lockPref("dom.idle-detection.enabled", false);
lockPref("dom.battery.enabled", false);
lockPref("device.sensors.enabled", false);
// WebTransport uses a separate transport stack and is NOT covered by the
// nsHttpChannel attestation hook in patch 006.  Disable until a hook for
// that path is added.
lockPref("network.webtransport.enabled", false);
// Block web content from treating file:// as a navigable scheme.  The site
// filter (patch 014) only gates http/https; this stops file:// surfacing
// through normal navigation paths.
lockPref("network.protocol-handler.expose.file", false);
lockPref("network.file.disable_unc_paths", true);
